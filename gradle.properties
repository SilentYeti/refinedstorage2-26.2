refinedarchitectVersion=1.7.0

# Upstream's refinedarchitect.root plugin normally derives this from git tags; that mechanism wasn't
# touched, but nothing in this fork's history has retagged since 3.2.1, so it falls back to Gradle's
# "unspecified" -- which NeoForge's mods.toml parser rejects outright ("Illegal version number
# specified unspecified"). Override explicitly until this fork's own release process is decided.
version=3.3.0-26.2-port

#########################################################
# MC 26.2 port -- see PORTING.md                        #
#########################################################
minecraft_version=26.2
neoform_version=26.2-2
neoforge_version=26.2.0.88
neoforge_version_range=[26.2.0.0,)
fabric_loader_version=0.19.5
fabric_api_version=0.161.0+26.2
cloth_config_version=26.2.155
modmenu_version=20.0.2
teamreborn_energy_version=5.0.0

# Gradle
org.gradle.java.home=/usr/lib/jvm/java-25-openjdk
org.gradle.jvmargs=-Xmx1G
org.gradle.configureondemand=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
